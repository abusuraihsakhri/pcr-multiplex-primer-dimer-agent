[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcr-multiplex-primer-dimer-engine"
version = "2.0.0"
description = "MultiplexPCR-Designer: Primer Dimer, Hairpin & DeltaG Annealing Matrix Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pcr-multiplex-primer-dimer-engine = "multiplex_pcr.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pcr-multiplex-primer-dimer-engine"
Repository = "https://github.com/abusuraihsakhri/pcr-multiplex-primer-dimer-engine.git"
