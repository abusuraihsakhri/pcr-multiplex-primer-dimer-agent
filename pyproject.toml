[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcr-multiplex-primer-dimer-agent"
version = "2.0.0"
description = "Heuristic PCR primer complementarity screen with legacy metric audit"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
pcr-multiplex-primer-dimer-agent = "cli:main"
pcr-multiplex-primer-dimer-engine = "multiplex_pcr.cli:main"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "multiplex_pcr_app"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "multiplex_pcr", "multiplex_pcr.*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pcr-multiplex-primer-dimer-agent"
Repository = "https://github.com/abusuraihsakhri/pcr-multiplex-primer-dimer-agent.git"
